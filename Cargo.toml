[package]
name = "english-axum"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
dotenvy = "0.15.7"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sqlx = { version = "0.9.0", features = ["postgres", "uuid", "chrono", "migrate", "runtime-tokio"] }
tokio = { version = "1.53.3", features = ["full"] }
utoipa = { version = "6.0.0", features = ["axum_extras"] }
utoipa-swagger-ui = { version = "10.0.1", features = ["axum"] }
